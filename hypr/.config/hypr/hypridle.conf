# hypridle: inactividad (formato de hypridle, no Lua). Respeta los inhibidores de Wayland:
# con la cafeína de la barra activa (IdleInhibitor de Quickshell) no salta ningún listener.
# Con la config de Hyprland en Lua, `hyprctl dispatch` también recibe Lua.

general {
    # Bloqueo de Quickshell (Lock.qml); `loginctl lock-session` lo pide a través de logind
    lock_cmd = qs ipc call lock lock
    # Antes de suspender: bloquear. Al despertar: pantalla encendida (evita pulsar dos veces)
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 10 min sin actividad: bloquear y apagar la pantalla
listener {
    timeout = 600
    on-timeout = loginctl lock-session; hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 30 min sin actividad: suspender
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
