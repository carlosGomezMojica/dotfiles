# MPD: biblioteca local para el reproductor de Quickshell (pestaña MPD del panel multimedia)

music_directory     "~/Música"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
state_file          "~/.local/share/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"

# mpc se conecta por defecto a localhost:6600
bind_to_address     "127.0.0.1"
port                "6600"

# Indexar sola la música nueva y no arrancar sonando tras reiniciar
auto_update         "yes"
restore_paused      "yes"

audio_output {
    type            "pipewire"
    name            "PipeWire"
}
