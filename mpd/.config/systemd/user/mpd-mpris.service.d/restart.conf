# mpd-mpris termina (con éxito) si pierde la conexión con MPD, p. ej. al reiniciarlo:
# volver a arrancarlo siempre para que MPD siga publicándose por MPRIS.
# Conexión por TCP (como en mpd.conf): si existe $XDG_RUNTIME_DIR/mpd/socket (activación
# por socket de mpd.socket) mpd-mpris lo prefiere y falla porque MPD no escucha ahí.
[Unit]
After=mpd.service

[Service]
ExecStart=
ExecStart=mpd-mpris -no-instance -network tcp -host 127.0.0.1 -port 6600
Restart=always
RestartSec=3
